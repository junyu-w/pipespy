name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: vet
        run: go vet ./...

      - name: test
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            # includes the ConPTY test that drives the real TUI in a pseudo console
            go test -v -count=1 ./...
          else
            go test -race -count=1 ./...
          fi

      - name: smoke test the binary
        run: |
          go build -o bin/ .
          scripts/smoke.sh bin/pipespy

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build every release target
        run: |
          for t in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            echo "::group::$t"
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go vet ./...
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null .
            echo "::endgroup::"
          done
