name: release

# Push a tag like v1.2.3 to build, verify and publish a release.
# Run it manually (Actions → release → Run workflow) for a dry run that
# builds and smoke-tests everything without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the dry run (no release is published)"
        default: "0.0.0-dryrun"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: cross-compile and package
        run: |
          version=${VERSION#v}
          echo "building $version"
          mkdir -p dist build
          for t in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}
            name=pipespy_${version}_${os}_${arch}
            ext=; [ "$os" = windows ] && ext=.exe
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$version" -o "build/$name/pipespy$ext" .
            cp README.md LICENSE "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -l dist && cat dist/checksums.txt

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Run each release binary on its real OS before anything is published.
  smoke:
    needs: build
    name: smoke (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: linux_amd64,   ext: tar.gz }
          - { os: ubuntu-24.04-arm, target: linux_arm64,   ext: tar.gz }
          - { os: macos-latest,     target: darwin_arm64,  ext: tar.gz }
          - { os: windows-latest,   target: windows_amd64, ext: zip }
          - { os: windows-11-arm,   target: windows_arm64, ext: zip }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: verify checksum, unpack, smoke test
        run: |
          version=${VERSION#v}
          name=pipespy_${version}_${{ matrix.target }}
          file=$name.${{ matrix.ext }}
          (cd dist && grep " $file\$" checksums.txt | sha256sum -c -)
          mkdir unpacked
          if [ "${{ matrix.ext }}" = zip ]; then unzip -q "dist/$file" -d unpacked; else tar -xzf "dist/$file" -C unpacked; fi
          scripts/smoke.sh "unpacked/$name/pipespy" "$version"

  publish:
    if: github.ref_type == 'tag'
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags, for the changelog
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: write release notes
        env:
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" "$OWNER" > notes.md && cat notes.md
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # --generate-notes appends GitHub's own notes (merged PRs, new
        # contributors, full-changelog link) after notes.md.
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "pipespy ${VERSION#v}" \
            --notes-file notes.md --generate-notes --verify-tag

  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: update formula in the tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version=${VERSION#v}
          install -m 600 /dev/null ~/tap_key
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone "git@github.com:$OWNER/homebrew-tap.git" tap
          scripts/render-formula.sh "$OWNER" "$version" > tap/Formula/pipespy.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/pipespy.rb
          if git diff --cached --quiet; then echo "formula unchanged"; exit 0; fi
          git commit -m "pipespy $version"
          git push origin HEAD:main

  scoop:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: update manifest in the bucket
        env:
          SCOOP_DEPLOY_KEY: ${{ secrets.SCOOP_DEPLOY_KEY }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version=${VERSION#v}
          install -m 600 /dev/null ~/bucket_key
          printf '%s\n' "$SCOOP_DEPLOY_KEY" > ~/bucket_key
          export GIT_SSH_COMMAND="ssh -i ~/bucket_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone "git@github.com:$OWNER/scoop-bucket.git" bucket
          scripts/render-scoop.sh "$OWNER" "$version" dist/checksums.txt > bucket/bucket/pipespy.json
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/pipespy.json
          if git diff --cached --quiet; then echo "manifest unchanged"; exit 0; fi
          git commit -m "pipespy $version"
          git push origin HEAD:main

  # Install through Homebrew and Scoop on clean runners, like a user would.
  verify-install:
    needs: [homebrew, scoop]
    uses: ./.github/workflows/verify-install.yml
    with:
      version: ${{ github.ref_name }}
